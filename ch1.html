<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 1, A New Voyage Round the World by William Dampier, 1697 Edition</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        a {
            color: blue;
        }

        .map-container {
            position: relative;
            width: 100%;
            padding-bottom: 75%;
            /* Sets a 4:3 aspect ratio (480 / 640 = 0.75) */
            height: 0;
            overflow: hidden;
        }

        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <div class="map-container">
        <iframe src="https://www.google.com/maps/d/embed?mid=1Df50cew-ibORmzEG_1qooUKVgTcWsXg&ehbc=2E312F"></iframe>
    </div>

</body>

</html>
